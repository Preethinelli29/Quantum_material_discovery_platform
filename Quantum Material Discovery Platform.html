<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Quantum Material Discovery Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1A;
    --panel:#10182C;
    --panel-2:#141E38;
    --line:rgba(140,160,210,0.14);
    --line-soft:rgba(140,160,210,0.08);
    --cyan:#4CE0E8;
    --cyan-dim:rgba(76,224,232,0.14);
    --violet:#9B7EF0;
    --violet-dim:rgba(155,126,240,0.16);
    --green:#3DDC97;
    --green-dim:rgba(61,220,151,0.14);
    --amber:#E8B84C;
    --text:#E7ECF7;
    --muted:#8791AC;
    --muted-2:#5C6688;
    --radius:14px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(155,126,240,0.10), transparent 60%),
      radial-gradient(900px 600px at -10% 20%, rgba(76,224,232,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
  }
  h1,h2,h3,h4,.display{font-family:'Space Grotesk',system-ui,sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--cyan-dim);color:var(--text);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#232E4C;border-radius:8px;}

  .glass{
    background:linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.012));
    border:1px solid var(--line);
    border-radius:var(--radius);
    backdrop-filter:blur(10px);
  }
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 20px;border-radius:10px;font-weight:600;font-size:14px;
    cursor:pointer;border:1px solid transparent;transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    font-family:'Inter',sans-serif;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:linear-gradient(135deg,var(--cyan),#38B6D9);color:#03222A;box-shadow:0 0 0 1px rgba(76,224,232,0.3), 0 8px 24px -8px rgba(76,224,232,0.5);}
  .btn-primary:hover{box-shadow:0 0 0 1px rgba(76,224,232,0.5), 0 10px 28px -6px rgba(76,224,232,0.65);}
  .btn-ghost{background:rgba(255,255,255,0.03);border:1px solid var(--line);color:var(--text);}
  .btn-ghost:hover{background:rgba(255,255,255,0.06);border-color:rgba(140,160,210,0.3);}
  .btn-violet{background:linear-gradient(135deg,var(--violet),#7358C9);color:#1A1030;box-shadow:0 0 0 1px rgba(155,126,240,0.35),0 8px 24px -8px rgba(155,126,240,0.5);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-sm{padding:7px 13px;font-size:12.5px;border-radius:8px;}

  .tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;letter-spacing:.2px;}
  .tag-illustrative{background:var(--amber-dim,rgba(232,184,76,0.14));color:var(--amber);border:1px solid rgba(232,184,76,0.3);}
  .tag-cyan{background:var(--cyan-dim);color:var(--cyan);border:1px solid rgba(76,224,232,0.3);}
  .tag-violet{background:var(--violet-dim);color:var(--violet);border:1px solid rgba(155,126,240,0.3);}
  .tag-green{background:var(--green-dim);color:var(--green);border:1px solid rgba(61,220,151,0.3);}

  input,select{
    background:rgba(255,255,255,0.03);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:10px 12px;font-size:14px;font-family:'Inter',sans-serif;outline:none;
    transition:border-color .15s ease;
  }
  input:focus,select:focus{border-color:rgba(76,224,232,0.5);}
  input::placeholder{color:var(--muted-2);}

  .scrollx{overflow-x:auto;}
  .scrollx::-webkit-scrollbar{height:8px;}

  #app{min-height:100%;}
  .layout{display:flex;min-height:100vh;}

  .sidebar{
    width:236px;flex-shrink:0;border-right:1px solid var(--line-soft);
    background:rgba(9,13,24,0.6);
    padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
    transition:width .2s ease, padding .2s ease;
  }
  .sidebar.collapsed{width:72px;padding:22px 10px;}
  .side-link{
    display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
    color:var(--muted);font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:2px;
    white-space:nowrap;overflow:hidden;
  }
  .side-link:hover{background:rgba(255,255,255,0.04);color:var(--text);}
  .side-link.active{background:linear-gradient(90deg, rgba(76,224,232,0.12), rgba(76,224,232,0.02));color:var(--cyan);}
  .side-link svg{flex-shrink:0;}
  .side-label{transition:opacity .15s ease;}
  .sidebar.collapsed .side-label,.sidebar.collapsed .side-section-label{display:none;}
  .side-section-label{font-size:10.5px;letter-spacing:.06em;color:var(--muted-2);padding:16px 12px 6px;font-weight:600;}

  .main{flex:1;min-width:0;}
  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:14px;
    padding:14px 26px;padding-top:calc(14px + env(safe-area-inset-top,0px));
    border-bottom:1px solid var(--line-soft);
    background:rgba(10,14,26,0.72);backdrop-filter:blur(12px);
  }
  .content{padding:28px 26px 60px;max-width:1180px;}

  .card{background:linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.01));border:1px solid var(--line);border-radius:16px;padding:20px;}
  .card:hover{border-color:rgba(140,160,210,0.24);}
  .metric{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;letter-spacing:-.5px;}

  .badge-dot{width:7px;height:7px;border-radius:50%;display:inline-block;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.03em;padding:10px 14px;border-bottom:1px solid var(--line);}
  td{padding:12px 14px;border-bottom:1px solid var(--line-soft);}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(255,255,255,0.02);}

  .grid-cols-fit{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;}

  .nav-fade-enter{animation:fadein .35s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(76,224,232,0.5);}70%{box-shadow:0 0 0 10px rgba(76,224,232,0);}100%{box-shadow:0 0 0 0 rgba(76,224,232,0);}}
  .pulse{animation:pulse-ring 2s infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spin{animation:spin 1s linear infinite;}
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  .floaty{animation:floaty 6s ease-in-out infinite;}
  @keyframes dash{to{stroke-dashoffset:0;}}

  .step-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;border:1px solid var(--line);color:var(--muted);flex-shrink:0;}
  .step-dot.done{background:var(--green);color:#052617;border-color:var(--green);}
  .step-dot.active{background:var(--cyan);color:#02222A;border-color:var(--cyan);}

  .progress-track{height:5px;border-radius:99px;background:rgba(255,255,255,0.06);overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .3s ease;}

  .toast{position:fixed;bottom:22px;right:22px;z-index:100;background:#0E1526;border:1px solid var(--line);border-radius:12px;padding:13px 18px;font-size:13.5px;box-shadow:0 20px 40px -12px rgba(0,0,0,0.6);display:flex;align-items:center;gap:10px;animation:toastin .25s ease;}
  @keyframes toastin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .qubit-wire{stroke:rgba(140,160,210,0.35);stroke-width:1.5;}
  .gate-box{cursor:pointer;transition:transform .12s ease;}
  .gate-box:hover{transform:translateY(-2px);}

  @media (max-width:860px){
    .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .2s ease;box-shadow:20px 0 40px rgba(0,0,0,0.4);}
    .sidebar.mobile-open{transform:translateX(0);}
    .sidebar.collapsed{width:236px;padding:22px 14px;}
    .sidebar.collapsed .side-label,.sidebar.collapsed .side-section-label{display:block;}
    .content{padding:20px 16px 50px;}
    .topbar{padding:12px 16px;}
    .hide-mobile{display:none;}
  }

  :root:not([data-theme="light"]) {}
  :root[data-theme="light"]{
    --bg:#F4F6FB; --panel:#FFFFFF; --panel-2:#FFFFFF;
    --line:rgba(30,40,70,0.12); --line-soft:rgba(30,40,70,0.07);
    --text:#141B2E; --muted:#5B6580; --muted-2:#8891AA;
  }
  :root[data-theme="light"] body{
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(155,126,240,0.08), transparent 60%),
      radial-gradient(900px 600px at -10% 20%, rgba(76,224,232,0.07), transparent 55%),
      var(--bg);
  }
  :root[data-theme="light"] .topbar{background:rgba(244,246,251,0.75);}
  :root[data-theme="light"] .sidebar{background:rgba(255,255,255,0.7);}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-root"></div>

<script>
/* ============================= DATA ============================= */
const MATERIALS = [
  {
    id:'lfp', name:'Lithium Iron Phosphate', formula:'LiFePO4', category:'Cathode Material',
    crystal:'Olivine', bandGap:3.7, formationEnergy:-2.13, stability:92, ionicMobility:'Moderate',
    description:'A well-established olivine-structured cathode material prized for thermal stability and long cycle life, at the cost of lower energy density than layered oxides.',
    notes:'Baseline reference candidate in this dataset — widely commercialized, included here for comparison against less-explored candidates.',
    simAvailable:true, isIllustrative:true, source:'Demonstration dataset (illustrative values)'
  },
  {
    id:'lco', name:'Lithium Cobalt Oxide', formula:'LiCoO2', category:'Cathode Material',
    crystal:'Layered (R-3m)', bandGap:2.7, formationEnergy:-1.89, stability:68, ionicMobility:'High',
    description:'A layered-oxide cathode with high energy density, historically dominant in consumer electronics, though cobalt cost and stability under deep cycling are known limitations.',
    notes:'Included as a high-mobility, lower-stability contrast case against LFP.',
    simAvailable:true, isIllustrative:true, source:'Demonstration dataset (illustrative values)'
  },
  {
    id:'nmc', name:'Lithium Nickel Manganese Cobalt Oxide', formula:'LiNiMnCoO2', category:'Cathode Material',
    crystal:'Layered (R-3m)', bandGap:2.9, formationEnergy:-1.97, stability:75, ionicMobility:'High',
    description:'A tunable layered oxide balancing energy density, cost, and stability by varying the Ni:Mn:Co ratio — the most widely deployed EV cathode chemistry.',
    notes:'Composition here reflects a generic NMC representative, not a specific stoichiometry ratio.',
    simAvailable:true, isIllustrative:true, source:'Demonstration dataset (illustrative values)'
  },
  {
    id:'llzo', name:'Lithium Lanthanum Zirconium Oxide', formula:'Li7La3Zr2O12', category:'Solid Electrolyte',
    crystal:'Garnet (cubic)', bandGap:5.4, formationEnergy:-3.42, stability:88, ionicMobility:'High (solid-state)',
    description:'A garnet-structured solid electrolyte of interest for all-solid-state batteries, offering high ionic conductivity with improved safety over liquid electrolytes.',
    notes:'Represents the solid-electrolyte category rather than a cathode candidate — useful contrast in comparison views.',
    simAvailable:true, isIllustrative:true, source:'Demonstration dataset (illustrative values)'
  },
  {
    id:'nfp', name:'Sodium Iron Phosphate', formula:'NaFePO4', category:'Sodium-Ion Material',
    crystal:'Maricite / Olivine', bandGap:3.4, formationEnergy:-1.78, stability:80, ionicMobility:'Moderate',
    description:'A cobalt-free, low-cost sodium-ion analogue to LFP, explored for grid-scale storage where energy density is less critical than cost and resource availability.',
    notes:'Included to represent the sodium-ion category as a complement to lithium-based candidates.',
    simAvailable:true, isIllustrative:true, source:'Demonstration dataset (illustrative values)'
  }
];

const CATEGORY_COLOR = {
  'Cathode Material':'var(--cyan)',
  'Solid Electrolyte':'var(--violet)',
  'Sodium-Ion Material':'var(--green)',
  'Other Candidates':'var(--amber)'
};

const GATES = [
  {sym:'H', name:'Hadamard', color:'var(--cyan)', matrix:'1/√2 [[1, 1], [1, -1]]', purpose:'Creates superposition from a basis state.', effect:'Applied to |0⟩, produces an equal superposition of |0⟩ and |1⟩ — the qubit is now equally likely to be measured as either.'},
  {sym:'X', name:'Pauli-X', color:'var(--violet)', matrix:'[[0, 1], [1, 0]]', purpose:'Bit-flip gate, the quantum analogue of a classical NOT.', effect:'Maps |0⟩ → |1⟩ and |1⟩ → |0⟩, flipping the qubit\'s basis state.'},
  {sym:'Y', name:'Pauli-Y', color:'var(--violet)', matrix:'[[0, -i], [i, 0]]', purpose:'Combines a bit-flip and a phase-flip.', effect:'Rotates the qubit state around the Y-axis of the Bloch sphere by π radians.'},
  {sym:'Z', name:'Pauli-Z', color:'var(--violet)', matrix:'[[1, 0], [0, -1]]', purpose:'Phase-flip gate — leaves |0⟩ unchanged, flips the phase of |1⟩.', effect:'Maps |1⟩ → -|1⟩, leaving measurement probabilities unchanged but altering interference behavior.'},
  {sym:'Rz', name:'Rotation (Rz)', color:'var(--green)', matrix:'[[e^-iθ/2, 0], [0, e^iθ/2]]', purpose:'Parameterized rotation used to tune variational circuits.', effect:'Rotates the qubit\'s phase by an angle θ — this is the tunable parameter VQE optimizes.'},
  {sym:'M', name:'Measurement', color:'var(--amber)', matrix:'Projective, {|0⟩⟨0|, |1⟩⟨1|}', purpose:'Collapses the qubit to a classical bit.', effect:'Reads out the qubit as 0 or 1 with probability given by the squared amplitude of each basis state.'}
];

/* ============================= STATE ============================= */
const state = {
  route: 'landing',
  sidebarCollapsed: false,
  mobileNavOpen: false,
  theme: 'dark',
  search: '',
  explorer: { query:'', category:'All', minStability:0, sort:'name' },
  selectedMaterial: null,
  comparisonIds: [],
  sim: {
    materialId: MATERIALS[0].id,
    qubits: 4,
    algorithm: 'VQE',
    iterations: 40,
    simulator: 'Statevector (educational)',
    running: false,
    progressStep: 0,
    result: null
  }
};

function nav(route, opts={}){
  state.route = route;
  Object.assign(state, opts);
  state.mobileNavOpen = false;
  render();
  window.scrollTo({top:0, behavior:'instant'});
}
function toast(msg, kind='cyan'){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast mono';
  const color = kind==='green' ? 'var(--green)' : kind==='amber' ? 'var(--amber)' : 'var(--cyan)';
  el.innerHTML = `<span class="badge-dot" style="background:${color}"></span><span style="font-family:Inter,sans-serif;font-size:13.5px;">${msg}</span>`;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s ease'; setTimeout(()=>el.remove(),300); }, 2800);
}

/* ============================= ICONS ============================= */
const ICONS = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  atom:'<circle cx="12" cy="12" r="1.5"/><ellipse cx="12" cy="12" rx="9" ry="3.8"/><ellipse cx="12" cy="12" rx="9" ry="3.8" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.8" transform="rotate(120 12 12)"/>',
  cpu:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
  circuit:'<circle cx="5" cy="6" r="1.8"/><circle cx="19" cy="18" r="1.8"/><path d="M5 6h6M14 6h5M19 18h-6M10 18H5"/><rect x="8" y="4" width="6" height="4" rx="1"/><rect x="11" y="16" width="6" height="4" rx="1"/>',
  layers:'<path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M2 15l10 5 10-5"/><path d="M2 11.5l10 5 10-5"/>',
  book:'<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5V4.5Z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>',
  info:'<circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.01"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  sun:'<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8l1.8-1.8M18 6l1.8-1.8"/>',
  moon:'<path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11Z"/>',
  menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',
  chevronLeft:'<path d="m14 6-6 6 6 6"/>',
  play:'<path d="M6 4.5v15l13-7.5-13-7.5Z"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 15.4-6.4L21 8M21 12a9 9 0 0 1-15.4 6.4L3 16M21 3v5h-5M3 16v5h5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="m5 12 5 5 9-9"/>',
  arrowRight:'<path d="M5 12h14M13 5l7 7-7 7"/>',
  download:'<path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V17"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  scale:'<path d="M12 3v18M5 7h14M5 7l-3 6h6l-3-6Zm14 0l-3 6h6l-3-6Z"/>',
  flask:'<path d="M9 2h6M10 2v6.5L4.5 19a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L14 8.5V2"/><path d="M7 15h10"/>'
};
function icon(name, size=18, extra=''){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${ICONS[name]||''}</svg>`;
}

/* ============================= LAYOUT SHELL ============================= */
const NAV_ITEMS = [
  {sec:'Overview'},
  {id:'landing', label:'Home', icon:'home'},
  {id:'dashboard', label:'Research Dashboard', icon:'grid'},
  {sec:'Research'},
  {id:'explorer', label:'Material Explorer', icon:'atom'},
  {id:'lab', label:'Simulation Lab', icon:'cpu'},
  {id:'circuit', label:'Circuit Visualizer', icon:'circuit'},
  {id:'compare', label:'Comparison', icon:'layers'},
  {sec:'Documentation'},
  {id:'insights', label:'Research Insights', icon:'book'},
  {id:'about', label:'About Project', icon:'info'}
];

function shell(innerHtml){
  const sc = state.sidebarCollapsed ? 'collapsed' : '';
  const mo = state.mobileNavOpen ? 'mobile-open' : '';
  return `
  <div class="layout">
    <aside class="sidebar ${sc} ${mo}" id="sidebar">
      <div style="display:flex;align-items:center;gap:10px;padding:6px 10px 22px;cursor:pointer;" onclick="nav('landing')">
        <div style="width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--cyan),var(--violet));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 16px -4px rgba(76,224,232,0.5);">
          ${icon('atom',19,'style="color:#04121A"')}
        </div>
        <div class="side-label" style="line-height:1.15;">
          <div class="display" style="font-weight:700;font-size:14px;">QMDP</div>
          <div style="font-size:10px;color:var(--muted-2);letter-spacing:.03em;">Research Prototype</div>
        </div>
      </div>
      ${NAV_ITEMS.map(item=>{
        if(item.sec) return `<div class="side-section-label">${item.sec}</div>`;
        const active = state.route===item.id ? 'active' : '';
        return `<div class="side-link ${active}" onclick="nav('${item.id}')">${icon(item.icon,17)}<span class="side-label">${item.label}</span></div>`;
      }).join('')}
      <div style="margin-top:18px;padding:12px;border-top:1px solid var(--line-soft);" class="hide-mobile">
        <div class="side-link" onclick="toggleSidebar()" style="justify-content:${state.sidebarCollapsed?'center':'flex-start'};">
          ${icon('chevronLeft',16,`style="transform:rotate(${state.sidebarCollapsed?180:0}deg);transition:transform .2s;"`)}
          <span class="side-label">Collapse</span>
        </div>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div style="display:none;" class="hide-mobile-inv"></div>
        <div onclick="toggleMobileNav()" style="display:flex;cursor:pointer;padding:6px;margin-left:-6px;" class="only-mobile">${icon('menu',20)}</div>

/* ============================= SVG CHART HELPERS ============================= */
function svgLine(points, w, h, color, fillId){
  const xs = points.map((_,i)=> (i/(points.length-1))*w);
  const max = Math.max(...points), min = Math.min(...points);
  const range = (max-min)||1;
  const ys = points.map(p=> h - ((p-min)/range)*h*0.86 - h*0.06);
  const path = xs.map((x,i)=> `${i===0?'M':'L'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const area = `${path} L${xs[xs.length-1].toFixed(1)},${h} L0,${h} Z`;
  return `
  <svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" preserveAspectRatio="none">
    ${fillId?`<defs><linearGradient id="${fillId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs><path d="${area}" fill="url(#${fillId})" stroke="none"/>`:''}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}
function donutChart(segments, size=160, stroke=22){
  const total = segments.reduce((a,s)=>a+s.value,0)||1;
  const r = (size-stroke)/2;
  const c = size/2;
  const circ = 2*Math.PI*r;
  let offset = 0;
  const arcs = segments.map(s=>{
    const frac = s.value/total;
    const len = frac*circ;
    const dash = `${len} ${circ-len}`;
    const rot = (offset/total)*360 - 90;
    offset += s.value;
    return `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${stroke}" stroke-dasharray="${dash}" transform="rotate(${rot} ${c} ${c})" stroke-linecap="butt" />`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${arcs}</svg>`;
}
function radarChart(axes, series, size=280){
  const c = size/2, r = size*0.36, n = axes.length;
  const angle = i => (Math.PI*2*i/n) - Math.PI/2;
  const ring = (frac)=> axes.map((_,i)=>{
    const a = angle(i); return `${c+Math.cos(a)*r*frac},${c+Math.sin(a)*r*frac}`;
  }).join(' ');
  const grid = [0.25,0.5,0.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join('');
  const axisLines = axes.map((_,i)=>{ const a=angle(i); return `<line x1="${c}" y1="${c}" x2="${c+Math.cos(a)*r}" y2="${c+Math.sin(a)*r}" stroke="var(--line)" stroke-width="1"/>`; }).join('');
  const labels = axes.map((label,i)=>{
    const a = angle(i); const lx = c+Math.cos(a)*(r+22), ly = c+Math.sin(a)*(r+16);
    const anchor = Math.abs(Math.cos(a))<0.3 ? 'middle' : (Math.cos(a)>0?'start':'end');
    return `<text x="${lx}" y="${ly}" font-size="10.5" fill="var(--muted)" text-anchor="${anchor}" font-family="Inter,sans-serif">${label}</text>`;
  }).join('');
  const polys = series.map(s=>{
    const pts = s.values.map((v,i)=>{ const a=angle(i); return `${c+Math.cos(a)*r*v},${c+Math.sin(a)*r*v}`; }).join(' ');
    return `<polygon points="${pts}" fill="${s.color}" fill-opacity="0.18" stroke="${s.color}" stroke-width="2"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="${size}">${grid}${axisLines}${polys}${labels}</svg>`;
}
function barChartH(items, w=460, barH=26, gap=14){
  const max = Math.max(...items.map(i=>i.value), 1);
  const h = items.length*(barH+gap);
  const labelW = 150;
  const chartW = w - labelW - 50;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    ${items.map((it,i)=>{
      const y = i*(barH+gap);
      const bw = (it.value/max)*chartW;
      return `
      <text x="0" y="${y+barH*0.65}" font-size="11.5" fill="var(--muted)" font-family="Inter,sans-serif">${it.label}</text>
      <rect x="${labelW}" y="${y}" width="${chartW}" height="${barH}" rx="5" fill="var(--line-soft)"/>
      <rect x="${labelW}" y="${y}" width="${bw}" height="${barH}" rx="5" fill="${it.color}"/>
      <text x="${labelW+bw+8}" y="${y+barH*0.65}" font-size="11.5" fill="var(--text)" font-family="IBM Plex Mono,monospace">${it.display!==undefined?it.display:it.value}</text>
      `;
    }).join('')}
  </svg>`;
}

function miniStat(label,val){
  return `<div style="background:rgba(255,255,255,0.02);border:1px solid var(--line-soft);border-radius:10px;padding:12px;">

  </div>`;

function miniCircuit(qubits){
  const w=280, rows=Math.min(qubits,5), rowH=34, top=14;
  let svg = `<svg viewBox="0 0 ${w} ${top+rows*rowH+10}" width="100%" height="${top+rows*rowH+10}">`;
  for(let q=0;q<rows;q++){
    const y = top+q*rowH;
    svg += `<line x1="30" y1="${y}" x2="${w-16}" y2="${y}" class="qubit-wire"/>`;
    svg += `<text x="0" y="${y+4}" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono">q${q}</text>`;
    const gates = q%2===0? ['H','Rz'] : ['Rz','X'];
    gates.forEach((g,gi)=>{
      const x = 60+gi*70;
      const col = g==='H'?'var(--cyan)':g==='X'?'var(--violet)':'var(--green)';
      svg += `<rect x="${x-13}" y="${y-13}" width="26" height="26" rx="5" fill="${col}" opacity="0.85"/>`;
      svg += `<text x="${x}" y="${y+4}" font-size="11" text-anchor="middle" fill="#04121A" font-family="IBM Plex Mono" font-weight="600">${g}</text>`;
    });
    svg += `<circle cx="${w-30}" cy="${y}" r="7" fill="none" stroke="var(--amber)" stroke-width="1.6"/><line x1="${w-34}" y1="${y-4}" x2="${w-26}" y2="${y+4}" stroke="var(--amber)" stroke-width="1.4"/>`;
  }
  svg += `</svg>`;
  return svg;
}
function updateSim(key,val){ state.sim[key]=val; state.sim.result=null; render(); }
function resetSimulation(){ state.sim.result=null; state.sim.progressStep=0; state.sim.running=false; render(); toast('Simulation reset'); }
function runSimulation(){
  if(state.sim.running) return;
  state.sim.running = true;
  state.sim.result = null;
  state.sim.progressStep = 0;
  render();
  const totalSteps = SIM_STEPS.length;
  let step = 0;
  const timer = setInterval(()=>{
    step++;
    state.sim.progressStep = step;
    render();
    if(step>=totalSteps){
      clearInterval(timer);
      finishSimulation();
    }
  }, 420);
}
function finishSimulation(){
  const s = state.sim;
  const m = MATERIALS.find(x=>x.id===s.materialId);
  const baseEnergy = m.formationEnergy - 0.3 - (s.qubits*0.02);
  const seriesLen = 12;
  const series = Array.from({length:seriesLen}, (_,i)=>{
    const t = i/(seriesLen-1);
    return baseEnergy*0.15 + (baseEnergy - baseEnergy*0.15) * (1-Math.exp(-4*t)) + (Math.random()-0.5)*0.01;
  });
  const finalEnergy = series[series.length-1];
  const histogram = Array.from({length:Math.min(s.qubits,4)}, (_,i)=>{
    const bit = i.toString(2).padStart(2,'0');
    return { label:'|'+bit.padStart(s.qubits>4?3:2,'0')+'…⟩', value: Math.round(Math.random()*60+15), color: i===0?'var(--cyan)':'var(--violet)' , display: undefined};
  }).sort((a,b)=>b.value-a.value);
  histogram.forEach(h=> h.display = h.value+' counts');

  state.sim.result = {
    qubits: s.qubits,
    iterations: s.iterations,
    energy: finalEnergy.toFixed(3),
    converged: true,
    execTime: (1.2 + s.qubits*0.3 + s.iterations*0.01).toFixed(2),
    convergenceSeries: series,
    histogram
  };
  state.sim.running = false;
  render();
  toast('Simulation converged — results ready', 'green');
}

        <div style="font-size:12.5px;color:var(--muted);line-height:1.6;">${g.effect}</div>
      </div>
      <div class="card" style="margin-top:16px;background:rgba(76,224,232,0.05);border-color:rgba(76,224,232,0.25);">
        <div style="font-size:12px;font-weight:600;color:var(--cyan);margin-bottom:6px;">Superposition, briefly</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.6;">The Hadamard gate creates an equal superposition when applied to the |0⟩ state — the qubit no longer holds a definite value until it's measured.</div>
      </div>
    </div>
  </div>
  <style>@media(max-width:900px){.circ-grid{grid-template-columns:1fr !important;}}</style>
  `;
}
function selectGate(sym){ circuitState.selectedGate = sym; render(); }
function updateCircuitQubits(v){ circuitState.qubits = v; render(); }
function fullCircuitSvg(qubits, animating){
  const rowH = 52, top = 20, w = 620;
  const layerX = [90,170,250,330,410];
  let svg = `<svg viewBox="0 0 ${w} ${top+qubits*rowH+10}" width="${w}" height="${top+qubits*rowH+10}" style="min-width:560px;">`;
  for(let q=0;q<qubits;q++){
    const y = top+q*rowH;
    svg += `<text x="0" y="${y+5}" font-size="12" fill="var(--muted)" font-family="IBM Plex Mono">q${q}: |0⟩</text>`;
    svg += `<line x1="65" y1="${y}" x2="${w-40}" y2="${y}" class="qubit-wire"/>`;
    const seq = q%2===0 ? ['H','Rz','X','M'] : ['Rz','H','Rz','M'];
    seq.forEach((g,gi)=>{
      const x = layerX[gi];
      const gate = GATES.find(x2=>x2.sym===g);
      const delay = animating ? `style="animation:fadein .4s ease ${(gi*qubits+q)*90}ms both;"` : '';
      if(g==='M'){
        svg += `<g ${delay}><circle cx="${x}" cy="${y}" r="12" fill="var(--panel-2)" stroke="var(--amber)" stroke-width="1.6"/><path d="M${x-6},${y+4} A6 6 0 0 1 ${x+6},${y+4}" fill="none" stroke="var(--amber)" stroke-width="1.4"/><line x1="${x}" y1="${y+4}" x2="${x+5}" y2="${y-4}" stroke="var(--amber)" stroke-width="1.4"/></g>`;
      } else {
        svg += `<g ${delay}><rect x="${x-15}" y="${y-15}" width="30" height="30" rx="6" fill="${gate.color}" opacity="0.9"/><text x="${x}" y="${y+5}" font-size="12" text-anchor="middle" fill="#04121A" font-family="IBM Plex Mono" font-weight="700">${g}</text></g>`;
      }
    });
    if(q<qubits-1){
      svg += `<line x1="${layerX[2]}" y1="${y}" x2="${layerX[2]}" y2="${y+rowH}" stroke="var(--violet)" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.5"/>`;
    }
  }
  svg += `</svg>`;
  return svg;
}
function animateCircuit(){
  circuitState.animating = true;
  render();
  setTimeout(()=>{ circuitState.animating=false; }, 1600);
}

        const on = state.comparisonIds.includes(m.id);
        return `<div onclick="toggleCompareFromExplorer('${m.id}')" style="cursor:pointer;padding:8px 13px;border-radius:9px;font-size:12.5px;border:1px solid ${on?'var(--cyan)':'var(--line)'};background:${on?'var(--cyan-dim)':'transparent'};color:${on?'var(--cyan)':'var(--muted)'};">
          ${on?icon('check',12):icon('plus',12)} ${m.formula}
        </div>`;
      }).join('')}
    </div>
  </div>

    <div class="card" style="text-align:center;padding:50px 20px;">
      <div style="color:var(--muted-2);margin-bottom:10px;">${icon('scale',30)}</div>
      <div style="font-weight:600;">Select at least two materials</div>
      <div style="color:var(--muted);font-size:13px;margin-top:6px;">Pick materials above to see a full property and simulation comparison.</div>
    </div>
  ` : `
  <div class="card">
    <div class="scrollx">
      <table style="min-width:${360+selected.length*160}px;">
        <thead><tr><th>Property</th>${selected.map(m=>`<th>${m.formula}</th>`).join('')}</tr></thead>
        <tbody>
          <tr><td>Material Name</td>${selected.map(m=>`<td>${m.name}</td>`).join('')}</tr>
          <tr><td>Category</td>${selected.map(m=>`<td>${m.category}</td>`).join('')}</tr>
          <tr><td>Formation Energy</td>${selected.map(m=>`<td class="mono">${m.formationEnergy} eV</td>`).join('')}</tr>
          <tr><td>Band Gap</td>${selected.map(m=>`<td class="mono">${m.bandGap} eV</td>`).join('')}</tr>
          <tr><td>Stability Indicator</td>${selected.map(m=>`<td class="mono">${m.stability}/100</td>`).join('')}</tr>
          <tr><td>Ionic Mobility</td>${selected.map(m=>`<td>${m.ionicMobility}</td>`).join('')}</tr>
          <tr><td>Est. Simulation Energy</td>${selected.map(m=>`<td class="mono">${(m.formationEnergy-0.35).toFixed(3)} Ha</td>`).join('')}</tr>
        </tbody>
      </table>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;" class="cmp-grid">
    <div class="card">
      <div style="font-weight:600;font-size:14px;margin-bottom:12px;">Stability Comparison</div>
      ${barChartH(selected.map((m,i)=>({label:m.formula, value:m.stability, color:compareColor(i), display:m.stability})), 380, 22, 12)}
    </div>
    <div class="card">
      <div style="font-weight:600;font-size:14px;margin-bottom:6px;">Property Radar</div>
      ${radarChart(['Stability','Band Gap','|Form. E|','Mobility'], selected.map((m,i)=>({
        color: compareColor(i),
        values: [
          m.stability/100,
          Math.min(m.bandGap/6,1),
          Math.min(Math.abs(m.formationEnergy)/3.5,1),
          m.ionicMobility.toLowerCase().includes('high')?0.9:0.55
        ]
      })))}
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;">
        ${selected.map((m,i)=>`<div style="display:flex;align-items:center;gap:6px;font-size:11.5px;"><span class="badge-dot" style="background:${compareColor(i)}"></span>${m.formula}</div>`).join('')}
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:18px;">
    <div style="font-weight:600;font-size:14px;margin-bottom:10px;">Screening Summary</div>
    ${screeningSummary(selected)}
    <div style="margin-top:14px;font-size:12px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line-soft);padding-top:12px;">
      Actual material selection requires evaluation of many additional physical properties, experimental testing, and domain-specific criteria beyond this demonstration screen.

  </div>
  `}
  <style>@media(max-width:820px){.cmp-grid{grid-template-columns:1fr !important;}}</style>
  `;
}
function compareColor(i){ return ['var(--cyan)','var(--violet)','var(--green)','var(--amber)'][i%4]; }
function screeningSummary(selected){
  const scored = selected.map(m=>{
    let score = 0;
    if(m.stability>=80) score++;
    if(Math.abs(m.formationEnergy)>=2) score++;
    if(m.ionicMobility.toLowerCase().includes('high')) score++;
    return {m, score};
  }).sort((a,b)=>b.score-a.score);
  const top = scored[0];
  return `
    <div style="font-size:13px;color:var(--text);margin-bottom:10px;">
      <strong>${top.m.formula}</strong> satisfies more of the selected screening criteria in this demonstration (${top.score}/3: stability, formation energy magnitude, ionic mobility).
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      ${scored.map(s=>`
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:70px;font-size:12px;" class="mono">${s.m.formula}</div>
          <div class="progress-track" style="flex:1;"><div class="progress-fill" style="width:${(s.score/3)*100}%"></div></div>
          <div class="mono" style="font-size:11.5px;color:var(--muted);width:30px;">${s.score}/3</div>
        </div>`).join('')}
    </div>
  `;
}
function exportComparisonCsv(){
  const selected = state.comparisonIds.map(id=>MATERIALS.find(m=>m.id===id)).filter(Boolean);
  if(selected.length===0) return;
  const headers = ['Name','Formula','Category','FormationEnergy_eV','BandGap_eV','Stability','IonicMobility'];
  const rows = selected.map(m=>[m.name,m.formula,m.category,m.formationEnergy,m.bandGap,m.stability,m.ionicMobility]);
  const csv = [headers.join(','), ...rows.map(r=>r.map(v=>`"${v}"`).join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'material_comparison.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Comparison exported as CSV', 'green');
}

/* ============================= PAGE: INSIGHTS ============================= */
function pageInsights(){
  return `
  <div style="margin-bottom:22px;">
    <h1 class="display" style="font-size:26px;font-weight:700;">Research Insights</h1>
    <p style="color:var(--muted);font-size:13.5px;margin-top:4px;">Background on the problem space, the computational methods in use today, and where this prototype fits.</p>
  </div>

  ${insightSection('Battery Material Discovery', `
    The performance of any battery — its energy density, charge rate, lifespan, and safety — is ultimately bounded by its materials, not just its engineering. Cathode chemistry, electrolyte composition, and interface stability each impose hard physical limits. Finding better materials is one of the highest-leverage ways to improve batteries broadly, which is why computational screening has become central to the field.
  `)}

  ${insightSection('Quantum Computing in Materials Science', `
    Quantum systems are naturally described using qubits, quantum states, and Hamiltonians — the same mathematical objects that describe electrons in a material. This makes quantum computers a structurally natural fit for simulating molecular and material systems, at least in principle. The Variational Quantum Eigensolver (VQE) is the leading near-term approach: it uses a parameterized quantum circuit to prepare candidate states, and a classical optimizer to iteratively drive the circuit toward the system's ground-state energy.
  `, [
    'Qubits — the quantum analogue of a bit, capable of superposition',
    'Quantum states — the full description of a qubit system\'s configuration',
    'Hamiltonians — the operator encoding a system\'s total energy',
    'Quantum circuits — sequences of gates that manipulate qubit states',
    'Ground-state energy — the lowest-energy, most stable configuration of a system'
  ])}

  ${insightSection('Existing Methods', `
    Quantum simulation doesn't stand alone — it sits alongside a set of established computational methods, each with different tradeoffs in accuracy, cost, and scale.
  `, [
    'Density Functional Theory (DFT) — the current workhorse for electronic structure calculations',
    'Molecular Dynamics — simulates atomic motion over time under a chosen force field',
    'Machine Learning — trained property predictors that trade some accuracy for speed',
    'High-throughput Screening — running many candidates through cheaper methods to narrow a shortlist'
  ])}

  ${insightSection('Proposed Approach', `
    This platform integrates a structured material dataset with an interactive, VQE-inspired simulation layer — letting a user move from browsing candidate materials to running a labeled, illustrative quantum energy estimation and comparing results, all within one interface. It is built to make the quantum method transparent rather than to represent quantum advantage.
  `)}

  ${insightSection('Limitations', `
    The prototype is intentionally scoped narrowly. Its purpose is demonstration and education, not validated materials research.
  `, [
    'Quantum hardware noise is not modeled — this runs on an idealized simulator',
    'Limited qubit resources restrict the model systems that can be represented',
    'Material models are simplified relative to real electronic structure',
    'Classical validation against established methods (e.g. DFT) has not been performed',
    'No experimental verification of any output has been conducted'
  ])}
  `;
}

function pageFor(route){
  switch(route){
    case 'landing': return pageLanding();
    case 'dashboard': return pageDashboard();
    case 'explorer': return pageExplorer();
    case 'material-detail': return pageMaterialDetail();
    case 'lab': return pageLab();
    case 'circuit': return pageCircuit();
    case 'compare': return pageCompare();
    case 'insights': return pageInsights();
    case 'about': return pageAbout();

}
function render(){
